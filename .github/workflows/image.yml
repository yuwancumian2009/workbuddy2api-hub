name: image

# Builds and publishes the image this fork is actually deployed from, so the NAS
# never has to compile anything: `docker compose pull` replaces
# `docker compose up -d --build`.
#
# The test suite runs first. Upstream's tests.yml only covers `main` and pull
# requests, so this job is the only gate that sees the `nas` branch - without it
# a rebase that silently dropped a local customization would be published.
on:
  push:
    branches: [nas]
    tags: ["nas-*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run every suite
        run: python tests/run_all.py

  image:
    name: build and push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` always points at the newest build of this branch; the tag
          # form (nas-v1.6.4-nas1) is what the NAS pins so an upgrade is a
          # deliberate one-line change.
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
